version: 2
updates:
  # Runtime + dev dependencies. Weekly on Mondays — keeps the noise
  # predictable and aligns with a normal review cycle.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Keep a single main branch; routine version updates are reviewed manually.
    # A zero limit does not disable Dependabot security alerts/updates.
    open-pull-requests-limit: 0
    reviewers:
      - UDAY368
    labels:
      - dependencies
    groups:
      types:
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Next + React + Tailwind are pinned exactly on purpose. Let
      # them flow through manual major bumps when we're ready.
      - dependency-name: next
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: tailwindcss
      - dependency-name: eslint-config-next
      # Keep aligned with the supported Next.js lint-toolchain range.
      - dependency-name: typescript
        versions: [">=7.0.0"]
      - dependency-name: vitest
        versions: [">=5.0.0"]

  # GitHub Actions in .github/workflows/. Catches setup-node /
  # checkout version bumps that keep the CI matrix healthy.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    reviewers:
      - UDAY368
    labels:
      - dependencies
      - github-actions
