name: Bodhinox validation
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  # Never cancel a main run: it may be applying production migrations.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-postgres
          POSTGRES_DB: bodhinox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d bodhinox_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ENV_FILE: .env.test
      # tsc needs ~2.4 GB for this codebase, above Node's default heap on the runner (16 GB RAM).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/ci-environment.cjs
      - run: npm run db:migrate
      - run: npm run db:roles
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: /tmp/bodhinox-e2e
          retention-days: 7
  # Railway waits for these checks, so a green push to main migrates the
  # production database before its code deploys.
  migrate:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/migrations.yml
    secrets: inherit
