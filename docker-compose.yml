services:
  web:
    build: .
    ports: ["3000:3000"]
    env_file: .env.local
    environment:
      NODE_ENV: production
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env.local
    environment:
      NODE_ENV: production
    restart: unless-stopped
